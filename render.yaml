services:
  - type: web
    name: careleo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careleo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: careleo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXP_MINUTES
        value: "10080"
      - key: ENVIRONMENT
        value: production
      - key: BASE_DOMAIN
        value: onrender.com
  - type: keyvalue
    name: careleo-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: careleo-db
    plan: free
